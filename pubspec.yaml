name: healthguardian
description: "Offline-first, two-tier AI patient triage app for elderly and rural populations."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fllama:
    git:
      url: https://github.com/Telosnex/fllama.git
      ref: main
  path_provider: ^2.1.6
  http: ^1.6.0
  image_picker: ^1.2.3
  device_info_plus: ^12.4.0
  flutter_bloc: ^9.1.0
  flutter_secure_storage: ^9.2.4
  camera: ^0.12.1
  record: ^7.1.1
  permission_handler: 12.0.1
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
